# =====================================================================
# 🧪 LOCAL PROFILE — embedded H2 database (no PostgreSQL install needed)
# Activate with:  --spring.profiles.active=local
#                 (or)  -Dspring-boot.run.profiles=local
#
# This OVERRIDES the PostgreSQL datasource from application.properties.
# Production config (PostgreSQL) is left untouched and is still the default.
# Data persists to ./data/intelliquiz.mv.db between runs.
# H2 console available at  http://localhost:8080/h2-console
# =====================================================================

# Port 8080 is taken by Jenkins on this machine — run IntelliQuiz on 8081 locally.
server.port=8081

spring.datasource.url=jdbc:h2:file:./data/intelliquiz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Handy web console for inspecting the local DB
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
